apply plugin: 'com.android.application'
android {
    namespace 'org.broeuschmeul.android.gps.usb.provider'
    compileSdk 35
    defaultConfig {
        applicationId "org.broeuschmeul.android.gps.usb.provider"
        minSdk 24
        targetSdk 34

        versionCode 202
        versionName "v3.0.2"
        vectorDrawables.useSupportLibrary = true
    }

    applicationVariants.all { variant ->
        variant.resValue "string", "version_name", variant.versionName
        variant.outputs.all { output ->
            output.outputFileName = "UsbGps4Droid-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    def signingProps = new Properties()
    def signingPropsFile = rootProject.file('local.properties')
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }
    def signingValue = { String key, String fallback ->
        System.getenv(key.replace('.', '_').toUpperCase()) ?: signingProps.getProperty(key) ?: fallback
    }
    def releaseStoreFile = signingValue('release.storeFile', 'keys/key')
    def releaseStorePassword = signingValue('release.storePassword', null)
    def releaseKeyAlias = signingValue('release.keyAlias', null)
    def releaseKeyPassword = signingValue('release.keyPassword', null)
    def hasReleaseSigning = releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    if (!hasReleaseSigning) {
        logger.warn('Release signing credentials are missing: set release.storeFile, ' +
                'release.storePassword, release.keyAlias and release.keyPassword in local.properties ' +
                '(or RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, ' +
                'RELEASE_KEY_PASSWORD environment variables). The release build will be unsigned.')
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    productFlavors {
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.3'
}
